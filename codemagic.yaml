workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 22.15.0
      java: 21
      vars:
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_ENABLE_AUTO_PIN: "0"
        CI: "true"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - artifacts/mobile/node_modules
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          corepack enable
          pnpm --version
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Expo prebuild
        script: |
          set -euo pipefail
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Sync lockfile after prebuild
        script: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Patch build.gradle
        script: |
          set -euo pipefail
          GRADLE="artifacts/mobile/android/app/build.gradle"

          # 1. arm64-only ABI split
          if ! grep -q "splits" "$GRADLE"; then
            printf '\nandroid {\n    splits {\n        abi {\n            enable true\n            reset()\n            include "arm64-v8a"\n            universalApk false\n        }\n    }\n}\n' >> "$GRADLE"
            echo "ABI split block added."
          else
            echo "ABI split block already present — skipping."
          fi

          # 2. Ensure Gradle knows the full path to node (corepack/nvm installs
          #    node in a path that sub-processes like Gradle may not see in PATH).
          #    NODE_BINARY is the env-var read by the React Native Gradle plugin.
          NODE_PATH_VAL=$(which node)
          echo "Node binary: $NODE_PATH_VAL ($($NODE_PATH_VAL --version))"
          PROPS="artifacts/mobile/android/gradle.properties"
          if ! grep -q "NODE_BINARY" "$PROPS"; then
            echo "" >> "$PROPS"
            echo "# Path to node used by the React Native bundler task" >> "$PROPS"
            echo "NODE_BINARY=$NODE_PATH_VAL" >> "$PROPS"
            echo "NODE_BINARY written to gradle.properties."
          else
            echo "NODE_BINARY already present in gradle.properties — skipping."
          fi

      - name: Bundle JS with Metro (expo export:embed — shows full error if any)
        script: |
          set -euo pipefail
          cd artifacts/mobile

          ASSETS_DIR="android/app/src/main/assets"
          RES_DIR="android/app/src/main/res"
          mkdir -p "$ASSETS_DIR" "$RES_DIR"

          # Run the same command Gradle calls internally so any Metro/TS error
          # is shown in full here rather than buried in Gradle output.
          pnpm exec expo export:embed \
            --platform android \
            --dev false \
            --bundle-output "$ASSETS_DIR/index.android.bundle" \
            --assets-dest "$RES_DIR"

          echo "=== Bundle produced ==="
          ls -lh "$ASSETS_DIR/"

      - name: Build release APK
        script: |
          set -euo pipefail
          cd artifacts/mobile/android
          chmod +x gradlew

          # NODE_BINARY is already set in gradle.properties (see patch step).
          # --info makes Gradle print the full Metro/node subprocess output so
          # any remaining errors are visible in the Codemagic log.
          ./gradlew assembleRelease --no-daemon --info 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}
          if [ $EXIT -ne 0 ]; then
            echo ""
            echo "====== BUILD ERROR SUMMARY ======"
            # Show Metro/node errors, skipping verbose Gradle stack frames
            grep -E "(error |Error |FAILED|Cannot find module|SyntaxError|Module not found|node.*exit|^> Task)" \
              /tmp/gradle.log | grep -v "^\s*at " | tail -80
            echo "================================="
            exit $EXIT
          fi

      - name: Locate and rename APK to mali.apk
        script: |
          set -euo pipefail
          OUTPUTS="artifacts/mobile/android/app/build/outputs"
          echo "=== APK output tree ==="
          find "$OUTPUTS" -name "*.apk" 2>/dev/null || echo "(no APKs found)"
          APK=$(find "$OUTPUTS" -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No release APK found under $OUTPUTS"
            exit 1
          fi
          DEST_DIR=$(dirname "$APK")
          mv "$APK" "$DEST_DIR/mali.apk"
          echo "Renamed to: $DEST_DIR/mali.apk"
          ls -lh "$DEST_DIR/"

    artifacts:
      - artifacts/mobile/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
