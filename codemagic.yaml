workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 22.15.0
      java: 21
      vars:
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_ENABLE_AUTO_PIN: "0"
        CI: "true"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - artifacts/mobile/node_modules
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          corepack enable
          pnpm --version
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Expo prebuild
        script: |
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Sync lockfile after prebuild
        script: |
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Patch build.gradle — arm64 only, release optimisation
        script: |
          # Append ABI split config so the release APK targets arm64-v8a only.
          # This alone cuts the APK from ~200 MB (all ABIs, debug) to ~20-30 MB.
          cat >> artifacts/mobile/android/app/build.gradle << 'GRADLE_EOF'

          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "arm64-v8a"
                      universalApk false
                  }
              }
          }
          GRADLE_EOF

      - name: Build release APK
        script: |
          cd artifacts/mobile/android
          chmod +x gradlew
          # assembleRelease: always bundles JS (no dev-server dependency),
          # enables R8 minification, strips debug symbols → much smaller APK.
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK to mali.apk
        script: |
          RELEASE_DIR="artifacts/mobile/android/app/build/outputs/apk/release"
          # Find the generated APK (name varies by ABI split setting)
          APK=$(find "$RELEASE_DIR" -name "*.apk" | head -1)
          mv "$APK" "$RELEASE_DIR/mali.apk"
          echo "APK ready: $RELEASE_DIR/mali.apk"
          ls -lh "$RELEASE_DIR/"

    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/release/mali.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
