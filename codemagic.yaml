workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 22.15.0
      java: 21
      vars:
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_ENABLE_AUTO_PIN: "0"
        CI: "true"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - artifacts/mobile/node_modules
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          corepack enable
          pnpm --version
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Expo prebuild
        script: |
          set -euo pipefail
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Sync lockfile after prebuild
        script: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Patch build.gradle — arm64 ABI split
        script: |
          set -euo pipefail
          # Only append if the splits block isn't already there (safe to re-run)
          GRADLE="artifacts/mobile/android/app/build.gradle"
          if ! grep -q "splits" "$GRADLE"; then
            cat >> "$GRADLE" << 'GRADLE_EOF'

android {
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
}
GRADLE_EOF
            echo "ABI split block added."
          else
            echo "ABI split block already present, skipping."
          fi

      - name: Build release APK
        script: |
          set -euo pipefail
          cd artifacts/mobile/android
          chmod +x gradlew
          # --stacktrace surfaces the real Babel/Metro error if bundling fails.
          # No pipe — exit code must propagate so the step fails correctly.
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and rename APK to mali.apk
        script: |
          set -euo pipefail
          OUTPUTS="artifacts/mobile/android/app/build/outputs"
          echo "=== APK output tree ==="
          find "$OUTPUTS" -name "*.apk" 2>/dev/null || echo "(no APKs found)"

          # Find ANY release APK produced (ABI-split name varies)
          APK=$(find "$OUTPUTS" -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No release APK found under $OUTPUTS"
            exit 1
          fi

          DEST_DIR=$(dirname "$APK")
          mv "$APK" "$DEST_DIR/mali.apk"
          echo "Renamed to: $DEST_DIR/mali.apk"
          ls -lh "$DEST_DIR/"

    artifacts:
      # Glob picks mali.apk wherever it lands under outputs
      - artifacts/mobile/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
