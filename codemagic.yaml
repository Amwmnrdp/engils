workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 22.15.0
      java: 21
      vars:
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_ENABLE_AUTO_PIN: "0"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - artifacts/mobile/node_modules
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          export COREPACK_ENABLE_STRICT=0
          export COREPACK_ENABLE_AUTO_PIN=0
          corepack enable
          pnpm --version
          pnpm install --no-frozen-lockfile

      - name: Expo prebuild (generate Android native project)
        script: |
          export COREPACK_ENABLE_STRICT=0
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --clean

      - name: Build Android APK (debug)
        script: |
          cd artifacts/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - artifacts/mobile/android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
