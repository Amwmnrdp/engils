workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 22.15.0
      java: 21
      vars:
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_ENABLE_AUTO_PIN: "0"
        CI: "true"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - artifacts/mobile/node_modules
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          corepack enable
          pnpm --version
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Expo prebuild
        script: |
          set -euo pipefail
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Sync lockfile after prebuild
        script: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Patch build.gradle with arm64 ABI split
        script: |
          set -euo pipefail
          GRADLE="artifacts/mobile/android/app/build.gradle"
          if ! grep -q "splits" "$GRADLE"; then
            printf '\nandroid {\n    splits {\n        abi {\n            enable true\n            reset()\n            include "arm64-v8a"\n            universalApk false\n        }\n    }\n}\n' >> "$GRADLE"
            echo "ABI split block added."
          else
            echo "ABI split block already present — skipping."
          fi

      - name: Bundle JS with Metro (via expo export:embed)
        script: |
          set -euo pipefail
          cd artifacts/mobile

          # Where Gradle expects the pre-built JS bundle and assets
          ASSETS_DIR="android/app/src/main/assets"
          RES_DIR="android/app/src/main/res"
          mkdir -p "$ASSETS_DIR" "$RES_DIR"

          # expo export:embed is the exact command Gradle calls internally.
          # We run it here directly so the full error is visible, then tell
          # Gradle to skip re-bundling and use this output instead.
          pnpm exec expo export:embed \
            --platform android \
            --dev false \
            --bundle-output "$ASSETS_DIR/index.android.bundle" \
            --assets-dest "$RES_DIR" \
            --reset-cache

          echo "=== Bundle produced ==="
          ls -lh "$ASSETS_DIR/"

      - name: Build release APK (Gradle, Metro skipped)
        script: |
          set -euo pipefail
          cd artifacts/mobile/android
          chmod +x gradlew

          # SKIP_BUNDLING=true — tells the React Native Gradle Plugin to skip
          # the createBundleReleaseJsAndAssets task and use the pre-built bundle
          # we placed in android/app/src/main/assets/ above.
          SKIP_BUNDLING=true ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo ""
            echo "====== GRADLE ERROR SUMMARY ======"
            grep -vE "^\s+at (org\.gradle|java\.|sun\.|com\.google)" /tmp/gradle.log | tail -60
            echo "=================================="
            exit $EXIT
          fi

      - name: Locate and rename APK to mali.apk
        script: |
          set -euo pipefail
          OUTPUTS="artifacts/mobile/android/app/build/outputs"
          echo "=== APK output tree ==="
          find "$OUTPUTS" -name "*.apk" 2>/dev/null || echo "(no APKs found)"
          APK=$(find "$OUTPUTS" -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No release APK found under $OUTPUTS"
            exit 1
          fi
          DEST_DIR=$(dirname "$APK")
          mv "$APK" "$DEST_DIR/mali.apk"
          echo "Renamed to: $DEST_DIR/mali.apk"
          ls -lh "$DEST_DIR/"

    artifacts:
      - artifacts/mobile/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
