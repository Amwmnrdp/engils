workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 22.15.0
      java: 21
      vars:
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_ENABLE_AUTO_PIN: "0"
        CI: "true"
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - artifacts/mobile/node_modules
        - node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          set -euo pipefail
          corepack enable
          pnpm --version
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Expo prebuild
        script: |
          set -euo pipefail
          cd artifacts/mobile
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Sync lockfile after prebuild
        script: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Patch build.gradle
        script: |
          set -euo pipefail
          GRADLE="artifacts/mobile/android/app/build.gradle"
          PROPS="artifacts/mobile/android/gradle.properties"

          # 1. arm64-only ABI split
          if ! grep -q "splits" "$GRADLE"; then
            printf '\nandroid {\n    splits {\n        abi {\n            enable true\n            reset()\n            include "arm64-v8a"\n            universalApk false\n        }\n    }\n}\n' >> "$GRADLE"
          fi

          # 2. Make Gradle use expo CLI (export:embed) instead of react-native bundle.
          #    - cliFile  : expo CLI JS entry so "node <cliFile> <bundleCommand>" works
          #    - bundleCommand : expo sub-command that accepts the same flags as bundle
          #    - entryFile : expo-router entry (RN defaults to missing index.js)
          #
          #    Result command Gradle will run:
          #      node node_modules/@expo/cli/build/bin/cli.js export:embed \
          #        --platform android --dev false \
          #        --bundle-output <path> --assets-dest <path> \
          #        --entry-file node_modules/expo-router/entry.js
          #
          #    This is identical to what pnpm exec expo export:embed does, so it
          #    always succeeds (same process that works in the pre-bundle step).
          if ! grep -q "cliFile" "$GRADLE"; then
            printf '\n// Monorepo: delegate bundling to expo CLI (avoids react-native bundle Babel issues)\nreact {\n    cliFile = file("../../node_modules/@expo/cli/build/bin/cli.js")\n    bundleCommand = "export:embed"\n    entryFile = file("../../node_modules/expo-router/entry.js")\n}\n' >> "$GRADLE"
          fi

          # 3. NODE_BINARY — absolute path so Gradle subprocess always finds node
          NODE_BIN=$(which node)
          if ! grep -q "NODE_BINARY" "$PROPS"; then
            printf '\nNODE_BINARY=%s\n' "$NODE_BIN" >> "$PROPS"
          fi

          echo "Patches applied. NODE_BINARY=$NODE_BIN"
          echo "--- patched react{} block ---"
          grep -A 8 "Monorepo: delegate" "$GRADLE" || true

      - name: Build release APK
        script: |
          set -euo pipefail
          cd artifacts/mobile/android
          chmod +x gradlew

          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/gradle.log
          EXIT=${PIPESTATUS[0]}

          if [ $EXIT -ne 0 ]; then
            echo ""
            echo "====== ERROR ======"
            grep -m 1 -B 6 "at loadFullConfig\|at Object\.transform\|SyntaxError\|Cannot find module\|Error:" \
              /tmp/gradle.log | grep -v "^--$" | head -15
            tail -15 /tmp/gradle.log
            echo "==================="
            exit $EXIT
          fi

      - name: Rename APK to mali.apk
        script: |
          set -euo pipefail
          OUTPUTS="artifacts/mobile/android/app/build/outputs"
          APK=$(find "$OUTPUTS" -name "*release*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No release APK found"; exit 1
          fi
          mv "$APK" "$(dirname "$APK")/mali.apk"
          echo "Done: $(dirname "$APK")/mali.apk"

    artifacts:
      - artifacts/mobile/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
